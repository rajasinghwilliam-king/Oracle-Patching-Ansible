---
- name: Load home and patch catalog
  ansible.builtin.import_playbook: tasks/load_home.yml

- name: Patch GI home
  hosts: home_nodes
  become: true
  any_errors_fatal: true
  pre_tasks:
    - name: Prepare node run directories
      ansible.builtin.import_tasks: tasks/run_setup.yml
  tasks:
    - name: Execute GI patch workflow
      block:
        - name: Run common operating system checks
          ansible.builtin.include_role:
            name: common_os_checks

        - name: Stage patch bundles
          ansible.builtin.include_role:
            name: stage_patch

        - name: Run GI pre-checks
          ansible.builtin.include_role:
            name: gi_prechecks

        - name: Back up GI home before patching
          ansible.builtin.include_role:
            name: backup_home
          when: mode == 'patch'

        - name: Apply GI patch
          ansible.builtin.include_role:
            name: gi_patch
          when: mode == 'patch'

        - name: Validate GI home after workflow
          ansible.builtin.include_role:
            name: post_validation
          when: mode == 'patch'
      rescue:
        - name: Mark GI workflow failed
          ansible.builtin.set_fact:
            report_status: FAILED

        - name: Notify GI failure
          ansible.builtin.include_role:
            name: notify
          vars:
            notify_status: FAILED
            notify_message: "GI workflow failed for {{ target_home }} on {{ inventory_hostname }}."

        - name: Stop after GI failure
          ansible.builtin.fail:
            msg: GI workflow failed; see stage reports.
      always:
        - name: Write GI stage report
          ansible.builtin.include_role:
            name: reporting
          vars:
            stage_name: "{{ 'gi_patch' if mode == 'patch' else 'precheck_gi' }}"

- name: Notify successful GI completion
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Send completion notification
      ansible.builtin.include_role:
        name: notify
      vars:
        notify_status: COMPLETED
        notify_message: "GI workflow completed for {{ target_home }} ({{ change_ref }})."