---
- name: Load home and patch catalog
  ansible.builtin.import_playbook: tasks/load_home.yml

- name: Run read-only pre-checks
  hosts: home_nodes
  become: true
  any_errors_fatal: true
  pre_tasks:
    - name: Prepare node run directories
      ansible.builtin.import_tasks: tasks/run_setup.yml
  tasks:
    - name: Execute pre-check workflow
      block:
        - name: Run common operating system checks
          ansible.builtin.include_role:
            name: common_os_checks

        - name: Stage patch bundles for analysis
          ansible.builtin.include_role:
            name: stage_patch

        - name: Run GI pre-checks
          ansible.builtin.include_role:
            name: gi_prechecks
          when: home.type == 'gi'

        - name: Run database pre-checks
          ansible.builtin.include_role:
            name: db_prechecks
          when: home.type == 'rdbms'
      rescue:
        - name: Mark pre-check workflow failed
          ansible.builtin.set_fact:
            report_status: FAILED

        - name: Notify pre-check failure
          ansible.builtin.include_role:
            name: notify
          vars:
            notify_status: FAILED
            notify_message: "Pre-check failed for {{ target_home }} on {{ inventory_hostname }}."

        - name: Stop after pre-check failure
          ansible.builtin.fail:
            msg: Pre-check workflow failed; see the stage report for details.
      always:
        - name: Write pre-check stage report
          ansible.builtin.include_role:
            name: reporting
          vars:
            stage_name: "{{ 'precheck_gi' if home.type == 'gi' else 'precheck_db' }}"

- name: Notify successful pre-check completion
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Send completion notification
      ansible.builtin.include_role:
        name: notify
      vars:
        notify_status: COMPLETED
        notify_message: "Pre-check completed for {{ target_home }} ({{ change_ref }})."