---
oracle_homes:
  gi_nonprod_cluster01:
    type: gi
    home_path: /u01/app/19.0.0/grid
    owner: grid
    hosts: [racdb01-np, racdb02-np]
    patch_ids:
      gi_ru: PATCH_ID_GI_RU
    backup_method: tar
    rolling: true
    dg_protected: false
    min_free_gb:
      home: 40
      stage: 30
      tmp: 10
      backup: 50
    thresholds:
      max_backup_age_hours: 24
  db_home_19_nonprod:
    type: rdbms
    home_path: /u01/app/oracle/product/19.0.0/dbhome_1
    owner: oracle
    hosts: [racdb01-np, racdb02-np]
    databases: [PRODDB]
    rac: true
    app_service: PRODDB_APP
    patch_ids:
      ru: PATCH_ID_RU
      ojvm: PATCH_ID_OJVM
    backup_method: tar
    recompile_invalid: true
    dg_protected: true
    standby_first: true
    min_free_gb:
      home: 25
      stage: 20
      tmp: 5
      backup: 30
    thresholds:
      max_active_sessions: 50
      max_invalid_objects: 0
      tablespace_max_used_pct: 90
      fra_max_used_pct: 80
      max_apply_lag_seconds: 30
      max_backup_age_hours: 24